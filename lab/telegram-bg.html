<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram 배경 일렁임</title>
<!-- 11-05 주형: Telegram 대화방 배경(twallpaper, MIT)을 원 · 코멧 기본형태에 씌운 참고용 한 장. 앱(index.html)과 따로 돎. 색은 발산 다이얼 방향 색 한 톤 4색. 설명은 README.md -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./twallpaper/style.css">
<style>
  :root { --ink: #1a1626; --sub: #6b6484; --line: rgba(20,15,36,.08); --bg: #f7f6fa; --size: 220px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(247,246,250,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--sub); white-space: nowrap; }
  #pal { flex-basis: 100%; }
  .grp button { font: inherit; font-size: 13px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .grp button[aria-pressed="true"] { background: #1c1730; color: #fff; border-color: #1c1730; }
  .sw { display: inline-flex; } .sw i { width: 10px; height: 10px; border-radius: 50%; margin-left: -3px; border: 1.5px solid #fff; }
  .grp input[type=range] { width: 120px; accent-color: #FF6A45; }
  main { padding: 28px 24px 60px; display: grid; gap: 40px; }
  section h2 { font-size: 15px; margin: 0 0 4px; }
  section p.note { margin: 0 0 18px; font-size: 13px; color: var(--sub); }
  .row { display: flex; flex-wrap: wrap; gap: 28px; }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
  figcaption { font-size: 13px; color: var(--sub); }
  .tile { position: relative; width: var(--size); height: var(--size); }
  .fill { position: absolute; inset: 0; overflow: hidden; }
  .fill > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .fill.tw-wrap { position: absolute; z-index: 1; }   /* twallpaper 는 담는 칸에 tw-wrap(화면 전체 fixed · z -1)을 붙임 — 칸 안에, 흰 바탕 위로 */
  .tile .ink { z-index: 2; }
  /* 모양 */
  .circle .fill { border-radius: 50%; }
  .stripes .base { position: absolute; inset: 0; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .stripes .fill { -webkit-mask: url(/figma5/H1/assets/23a03.svg) center / 100% 100% no-repeat; mask: url(/figma5/H1/assets/23a03.svg) center / 100% 100% no-repeat; }
  .body .fill { border-radius: 50%; }
  .body .ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }   /* 줄무늬는 원래 색(#4A4361) 그대로 위에 */
  .err { font-size: 12px; color: #c0392b; }
</style>
</head>
<body>
<header>
  <h1>Telegram 배경 일렁임</h1>
  <div class="grp" id="pal">다이얼 방향</div>
  <div class="grp">빠르기 <input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><span id="spdv">1.0</span></div>
  <div class="grp">칸 <input id="sz" type="range" min="120" max="360" step="10" value="220"><span id="szv">220</span></div>
</header>
<main>
  <section>
    <h2>Telegram 대화방 배경 <small style="font-weight:400;color:var(--sub)">twallpaper@2.1.2 · MIT · Canvas 2D</small></h2>
    <p class="note">색 4개가 정해진 자리 8곳을 돌며 부드럽게 자리를 바꿈. 원래 위에 깔리는 그림 무늬(패턴)는 넣지 않음.</p>
    <div class="row" data-kind="tw"></div>
  </section>
</main>
<script type="module">
  import { TWallpaper } from "./twallpaper/index.es.js";

  // 11-05 주형: 색은 한 톤 안에서 — 발산 방식 다이얼(dial_beo.js glowColor)이 점 방향으로 고르는 색 하나를 바탕으로, 같은 색상(hue)에서 밝기·채도만 다른 4톤
  function hsv(h, s, v) { h /= 360; s /= 100; v /= 100; const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
    return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][((i % 6) + 6) % 6].map(c => Math.round(c * 255)); }
  function glowColor([x, y]) {   // dial_beo.js 그대로 (빛 색은 방향으로만)
    let n = (Math.PI + Math.atan2(y, x)) / (2 * Math.PI); n = (((1 - n) + .5) % 1) * 360;
    const useHsv = n > 120;
    const stops = useHsv ? [[0, 57, 88], [51, 87, 87], [145, 42, 69], [198, 84, 72], [283, 29, 58], [360, 57, 88]] : [[225, 96, 96], [222, 192, 28], [103, 178, 135], [29, 136, 183], [135, 104, 147], [225, 96, 96]];
    const edges = [0, 90, 120, 240, 300, 360]; let c = stops[0];
    for (let i = 0; i < 5; i++) if (edges[i] <= n && n <= edges[i + 1]) { const f = (n - edges[i]) / (edges[i + 1] - edges[i]); c = [0, 1, 2].map(j => stops[i][j] + f * (stops[i + 1][j] - stops[i][j])); break; }
    return useHsv ? hsv(...c) : c.map(Math.trunc);
  }
  const toHsl = ([r, g, b]) => { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn; let h = 0, s = 0;
    if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; } return [h, s, l]; };
  const hex = (h, s, l) => { const a = s * Math.min(l, 1 - l), f = (n) => { const k = (n + h / 30) % 12, c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, "0"); }; return "#" + f(0) + f(8) + f(4); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // 11-05 주형: '칙칙함' → 어두운 톤을 빼고 채도를 올림. 밝기는 .58~.88 사이만, 색상은 ±10° 안에서만 살짝 비켜 맑게(한 톤 유지)
  function tones(rgb) {   // 바탕(선명) · 밝게 · 옆 색상 쪽 · 아주 옅게
    const [h, s] = toHsl(rgb), S0 = clamp(Math.max(s, .78) * 1.1, 0, 1);
    return [hex(h, S0, .6), hex((h + 10) % 360, clamp(S0 * .95, 0, 1), .72), hex((h + 350) % 360, S0, .64), hex(h, clamp(S0 * .85, 0, 1), .86)];
  }
  // 다이얼 둘레 8방향 (D2 와이어프레임 글자 그대로). 점 = 다이얼 끝(길이 1)
  const DIRS = [["창의적인", [1, 0]], ["낯설고 제각각", [.707, -.707]], ["다양한", [0, -1]], ["익숙하게 여러 갈래", [-.707, -.707]], ["친숙한", [-1, 0]], ["익숙하게 다듬기", [-.707, .707]], ["비슷한", [0, 1]], ["새롭게 한 줄기", [.707, .707]]];
  const PALETTES = Object.fromEntries(DIRS.map(([name, p]) => [name, tones(glowColor(p))]));
  const SHAPES = [["circle", "원"], ["stripes", "코멧 — 줄무늬에 색"], ["body", "코멧 — 몸에 색, 줄무늬 진하게"]];
  const S = { pal: "창의적인", speed: 1 };
  const live = [];   // { kind, inst, fill }

  // 머리 버튼
  const palBox = document.getElementById("pal");
  for (const [name, cs] of Object.entries(PALETTES)) {
    const b = document.createElement("button"); b.innerHTML = `<span class="sw">${cs.map(c => `<i style="background:${c}"></i>`).join("")}</span>${name}`;
    b.setAttribute("aria-pressed", String(name === S.pal)); b.onclick = () => { S.pal = name; [...palBox.querySelectorAll("button")].forEach(x => x.setAttribute("aria-pressed", String(x === b))); rebuild(); };
    palBox.appendChild(b);
  }
  const bind = (id, key, fn) => { const i = document.getElementById(id), v = document.getElementById(id + "v"); i.oninput = () => { v.textContent = i.value; fn(+i.value); }; };
  bind("spd", "speed", (v) => { S.speed = v; live.forEach(l => applySpeed(l)); });
  bind("sz", "size", (v) => { document.documentElement.style.setProperty("--size", v + "px"); rebuild(); });

  function tile(kind, shape, label) {
    const fig = document.createElement("figure"), t = document.createElement("div"); t.className = `tile ${shape}`;
    if (shape === "stripes") t.innerHTML = '<div class="base"></div>';
    const fill = document.createElement("div"); fill.className = "fill"; t.appendChild(fill);
    if (shape === "body") t.insertAdjacentHTML("beforeend", '<img class="ink" alt="" src="/figma5/H1/assets/23a03.svg">');
    fig.append(t); fig.insertAdjacentHTML("beforeend", `<figcaption>${label}</figcaption>`);
    return { fig, fill };
  }
  function makeTw(fill, colors) {
    const tw = new TWallpaper(fill, { colors, fps: Math.round(30 * S.speed), tails: 90, animate: true, scrollAnimate: false });   // pattern 없음 = 그림 무늬 안 보임
    tw.init(); return tw;
  }
  function applySpeed(l) {
    l.inst.updateFrametime(Math.max(5, Math.round(30 * S.speed)));
  }
  function dispose(l) {
    try { l.inst.dispose(); } catch (e) {}
  }
  function rebuild(only) {
    for (const row of document.querySelectorAll(".row")) {
      const kind = row.dataset.kind; if (only && only !== kind) continue;
      for (let i = live.length - 1; i >= 0; i--) if (live[i].kind === kind) { dispose(live[i]); live.splice(i, 1); }
      row.innerHTML = "";
      SHAPES.forEach(([shape, label], i) => {
        const { fig, fill } = tile(kind, shape, label); row.appendChild(fig);
        try { const inst = makeTw(fill, PALETTES[S.pal]); live.push({ kind, inst, fill }); }
        catch (e) { fig.insertAdjacentHTML("beforeend", `<span class="err">${e.message}</span>`); console.error(e); }
      });
    }
  }
  rebuild();
</script>
</body>
</html>
